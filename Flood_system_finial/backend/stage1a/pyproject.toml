# Tooling config for the Stage 1A module only.
# Scoped to backend/stage1a/ so it cannot affect Stage 1B's module.

[tool.pytest.ini_options]
# Makes `backend/` the import root, so tests import `stage1a.*` — the same
# path used by the T1A.0 VERIFY command.
pythonpath = [".."]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run: db.py holds a process-wide async engine
# and Redis client, and a per-test loop would leave them bound to a closed
# loop between tests.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.mypy]
# Canonical invocation (run from `backend/`, so `stage1a` is the package root
# and every module resolves under exactly one name):
#   mypy --config-file stage1a/pyproject.toml stage1a
python_version = "3.13"
explicit_package_bases = true
namespace_packages = true
# `stage1a/shared/contracts.py` imports `backend.shared.contracts` (the
# single cross-stage source of truth, added when merging with Stage 1B —
# see that file's docstring). mypy is invoked scoped to just the `stage1a`
# tree (see above), so without this it can't see `backend/` to resolve
# that import statically, even though it resolves fine at runtime.
# ".." here is relative to the invocation cwd (backend/), so this points
# mypy at the repo root, where `backend` is a real package (has
# `__init__.py`).
mypy_path = ".."
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["celery.*", "geoalchemy2.*"]
ignore_missing_imports = true
