[pytest]
asyncio_mode = auto
# Same reasoning as Stage 1B/2/3's pytest.ini: a module-level cached
# Redis client (once db.py grows one) would be bound to whichever event
# loop first creates it. Session-scoped loop matches the real runtime
# shape (one loop for the app's lifetime), copied here preemptively so
# future async tests don't need to rediscover this.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
