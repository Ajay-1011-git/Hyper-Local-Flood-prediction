[pytest]
asyncio_mode = auto
# db.py caches a module-level engine/session-factory/redis-client bound to
# whichever event loop first creates them (matching how the real FastAPI
# app will run with one loop for its lifetime). Function-scoped loops (the
# pytest-asyncio default) would create a fresh loop per test while those
# cached objects still belong to an earlier, closed loop -> asyncpg
# "another operation is in progress" errors. Session-scoped loop matches
# the actual runtime shape.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
