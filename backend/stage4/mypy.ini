[mypy]

# rasterio ships no py.typed marker / stubs (confirmed: mypy reports
# import-untyped, not a missing package) — this is upstream, not something
# stub-only packages fix, so silence just this one import rather than
# loosening checks project-wide. Same fix Stage 1B's mypy.ini already
# applies for the identical reason (T4B.3 reads Stage 1B's own DEM raster).
[mypy-rasterio.*]
ignore_missing_imports = True
