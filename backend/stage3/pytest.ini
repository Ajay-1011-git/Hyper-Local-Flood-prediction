[pytest]
asyncio_mode = auto
# db.py caches a module-level Redis client bound to whichever event loop
# first creates it (matching how the real FastAPI app runs, one loop for
# its lifetime) -- same reasoning as Stage 1B's pytest.ini (T1B.9), copied
# here now that T3.6 introduces this stage's first async tests. Function-
# scoped loops (pytest-asyncio's default) would create a fresh loop per
# test while the cached client still belongs to an earlier, closed loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
